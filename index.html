<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Consulting & HR Services - Your HR & Payroll Partner</title>
    <meta name="description" content="MS Consulting & HR Services offers comprehensive HR and Payroll solutions including employment contracts, disciplinary assistance, training & development, EMP 501 submissions, and more.">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: url('https://www.transparenttextures.com/patterns/marble.png'), #f8f8f8;
            background-size: 400px 400px;
            background-repeat: repeat;
        }
        .hero-section {
            background: linear-gradient(135deg, rgba(40,0,20,0.97) 0%, rgba(128,0,32,0.97) 100%);
            color: #FFD700;
            padding: 80px 0;
            text-align: center;
        }
        .section-heading {
            color: #800020;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .service-card {
            background: rgba(255,255,255,0.92);
            border: 1px solid #FFD700;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .service-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 24px rgba(128,0,32,0.15);
            border-color: #800020;
        }
        .service-card h4 {
            color: #800020;
        }
        .service-card p {
            color: #222;
        }
        .contact-info-box {
            background: rgba(255,255,255,0.97);
            border-left: 5px solid #FFD700;
        }
        .footer-bg {
            background: linear-gradient(90deg, #800020 0%, #000 100%);
        }
        .logo-placeholder {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #800020 60%, #FFD700 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFD700;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 12px rgba(128,0,32,0.2);
            overflow: hidden;
        }
        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-gold {
            background: linear-gradient(90deg, #FFD700 0%, #FFC300 100%);
            color: #800020;
            font-weight: bold;
            border: none;
            border-radius: 9999px;
            padding: 0.75rem 2rem;
            box-shadow: 0 2px 8px rgba(128,0,32,0.08);
            transition: background 0.3s, color 0.3s, transform 0.2s;
            display: inline-block;
        }
        .btn-gold:hover {
            background: #800020;
            color: #FFD700;
            transform: scale(1.05);
        }
        nav {
            background: rgba(0,0,0,0.98);
            border-bottom: 2px solid #FFD700;
        }
        nav a {
            color: #FFD700;
        }
        nav a:hover {
            color: #800020;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Navigation Bar -->
    <nav class="shadow-md py-4">
        <div class="container mx-auto flex justify-between items-center px-4">
