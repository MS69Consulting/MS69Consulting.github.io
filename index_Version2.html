<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Professional HR & Payroll Services, Employment Reconciliations, HR Support, Training & Development, and CIPC Services by Michelle Schreuder.">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f6f6f6;
      margin: 0;
      color: #222;
    }
    .card {
      background: rgba(255,255,255,0.95);
      max-width: 600px;
      margin: 40px auto;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.14);
      padding: 32px;
      text-align: left;
    }
    .logo-img {
      width: 100%;
      max-width: 380px;
      display: block;
      margin: 0 auto 16px auto;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: #a81c1c;
      letter-spacing: 0.02em;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      font-size: 1.2rem;
      font-style: italic;
      margin-bottom: 24px;
    }
    ul {
      margin: 24px 0 12px 0;
      padding-left: 22px;
    }
    li {
      margin-bottom: 10px;
      font-size: 1.06rem;
    }
    .contact {
      margin-top: 28px;
      font-size: 1.1rem;
      background: #f7f7f9;
      padding: 18px;
      border-radius: 8px;
      border-left: 4px solid #a81c1c;
    }
    .contact strong {
      display: inline-block;
      width: 66px;
    }
    @media (max-width: 700px) {
      .card { padding: 13px; }
      .logo-img { max-width: 99%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="businesscard.jpg" alt="MS Consulting Services Logo" class="logo-img">
    <h1>MS Consulting Services</h1>
    <div class="subtitle">Michelle Schreuder</div>
    <ul>
      <li>HR & Payroll Services</li>
      <li>Employment Reconciliations (EMP201, 501)</li>
      <li>HR Support, Training &amp; Development</li>
      <li>CIPC Services</li>
    </ul>
    <div class="contact">
      <div><strong>Phone:</strong> 082 811 7984</div>
      <div><strong>Email:</strong> 69msconsulting@gmail.com</div>
    </div>
  </div>

</html>
